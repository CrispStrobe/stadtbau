# SPDX-License-Identifier: AGPL-3.0-or-later
# Store screenshots (tasks T-402 / T-403).
#
# Runs the scripted tour in app/integration_test/screenshots_test.dart on iOS
# simulators and on an Android emulator and uploads the PNGs as artifacts.
# There is nothing to sign and nothing is uploaded to Apple or Google here: the
# artifact is the deliverable, and docs/release/screenshots.md describes how it
# is pushed to App Store Connect and to Play.
#
# Why `flutter drive` and not `flutter test integration_test/...`:
# IntegrationTestWidgetsFlutterBinding.takeScreenshot() does not write files, it
# returns the PNG bytes to whatever drives the test. Only the `flutter drive`
# adaptor (test_driver/integration_test.dart, integrationDriver(onScreenshot:))
# ever sees them. `flutter test -d <udid>` runs the same test but throws the
# bytes away.
#
# The two jobs are deliberately independent (no `needs:`), so an Android
# emulator failure never costs the iOS screenshots and vice versa.
name: screenshots

on:
  workflow_dispatch:
    inputs:
      devices:
        description: 'Comma-separated iOS simulator names to capture'
        type: string
        required: false
        default: 'iPhone 17 Pro Max,iPad Pro 13-inch (M5)'

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.1'
  BUNDLE_ID: com.crispstrobe.hectopolis

jobs:
  ios:
    name: iOS simulator screenshots
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # A simulator build is debug-only (`Release/Profile mode is not supported
      # for simulators`), so the red DEBUG ribbon is painted unless the app
      # turns it off. Fail here rather than shipping a ribboned screenshot.
      - name: Preflight — no debug banner
        run: |
          set -euo pipefail
          if ! grep -q 'debugShowCheckedModeBanner: *false' app/lib/main.dart; then
            echo "::error file=app/lib/main.dart::MaterialApp must set debugShowCheckedModeBanner: false."
            echo "Simulator/emulator builds are debug-only, so the red DEBUG ribbon would sit in every"
            echo "store screenshot. The flag only has an effect in debug builds, so this is a no-op for"
            echo "released binaries."
            exit 1
          fi

      - name: Toolchain
        run: |
          set -euo pipefail
          flutter --version
          xcodebuild -version
          # Flutter 3.44 leaves the Podfile installing the same plugins the SPM
          # references pull in, and the duplicate sources break the build; the
          # release pipeline strips SPM for the same reason.
          flutter config --no-enable-swift-package-manager

      - name: Dependencies
        run: |
          set -euo pipefail
          flutter pub get
          cd app
          flutter gen-l10n

      # Resolve the requested simulator names to UDIDs and boot them. `simctl
      # boot` can outlive its own timeout while succeeding, so the state is
      # confirmed with `bootstatus -b` instead of trusting the exit code.
      - name: Boot the simulators
        env:
          DEVICES: ${{ inputs.devices }}
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          python3 - "$RUNNER_TEMP/devices.json" "$DEVICES" > "$RUNNER_TEMP/simulators.tsv" <<'PY'
          import json, re, sys
          catalogue, requested = sys.argv[1], sys.argv[2]
          runtimes = json.load(open(catalogue))['devices']

          def version(runtime):
              # com.apple.CoreSimulator.SimRuntime.iOS-18-2 -> (18, 2)
              return tuple(int(p) for p in re.findall(r'\d+', runtime.rsplit('.', 1)[-1]))

          available = {}
          for runtime, devices in runtimes.items():
              for device in devices:
                  available.setdefault(device['name'], []).append((version(runtime), runtime, device['udid']))
          missing = []
          def family(n):
              # 'iPhone 17 Pro Max' -> 'iphone pro max', 'iPad Pro 13-inch (M5)' -> 'ipad pro 13-inch'
              n = re.sub(r'\s*\([^)]*\)', '', n)
              n = re.sub(r'\biPhone \d+e?\b', 'iPhone', n)
              return ' '.join(n.lower().split())
          for name in [n.strip() for n in requested.split(',') if n.strip()]:
              if name not in available:
                  # The runner's Xcode moves on (iPhone 16 -> 17, M4 -> M5): fall
                  # back to the newest device of the same family.
                  same = sorted(a for a in available if family(a) == family(name))
                  if not same:
                      missing.append(name)
                      continue
                  print(f'{name} not present, using {same[-1]}', file=sys.stderr)
                  name = same[-1]
              _, runtime, udid = sorted(available[name])[-1]  # newest runtime wins
              print(f'{name}\t{udid}\t{runtime}')
          if missing:
              print('requested simulators not available: ' + ', '.join(missing), file=sys.stderr)
              print('available: ' + ', '.join(sorted(available)), file=sys.stderr)
              sys.exit(1)
          PY
          cat "$RUNNER_TEMP/simulators.tsv"
          while IFS=$'\t' read -r name udid runtime; do
            echo "== booting $name ($udid, $runtime)"
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
          done < "$RUNNER_TEMP/simulators.tsv"
          xcrun simctl list devices | grep Booted || true

      # One `flutter drive` per simulator. The app is uninstalled first: when a
      # fresh build fails, `flutter drive` happily connects to whatever is
      # already installed and drives *that*, producing confidently wrong
      # screenshots of an old binary.
      - name: Drive the tour on each simulator
        working-directory: app
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r name udid runtime; do
            echo "== $name ($udid, $runtime)"
            xcrun simctl uninstall "$udid" "$BUNDLE_ID" || true
            SCREENSHOT_DEVICE="$name" flutter drive \
              --driver=test_driver/integration_test.dart \
              --target=integration_test/screenshots_test.dart \
              -d "$udid"
          done < "$RUNNER_TEMP/simulators.tsv"

      # Apple wants 1320x2868 for the 6.9" iPhone set (APP_IPHONE_67) and
      # 2064x2752 for the 13" iPad set (APP_IPAD_PRO_3GEN_129). A simulator of
      # those devices produces exactly those pixel sizes, unscaled — so a
      # mismatch means the wrong device was captured, not that scaling is due.
      - name: Report the captured sizes
        if: always()
        working-directory: app
        run: |
          set -euo pipefail
          if [ ! -d screenshots ]; then
            echo "::warning::no screenshots directory"
            exit 0
          fi
          {
            echo "| file | size |"
            echo "|---|---|"
            while IFS= read -r png; do
              w=$(sips -g pixelWidth "$png" | awk '/pixelWidth/ {print $2}')
              h=$(sips -g pixelHeight "$png" | awk '/pixelHeight/ {print $2}')
              echo "| $png | ${w}x${h} |"
            done < <(find screenshots -name '*.png' | sort)
          } >> "$GITHUB_STEP_SUMMARY"
          if ! find screenshots -name '*.png' | grep -q .; then
            echo "::error::the tour produced no PNGs"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-ios
          path: app/screenshots
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android emulator screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Explicit: a broken Android capture fails this job. It is a separate job
    # with no `needs:`, so the iOS artifact is uploaded either way.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Preflight — no debug banner
        run: |
          set -euo pipefail
          if ! grep -q 'debugShowCheckedModeBanner: *false' app/lib/main.dart; then
            echo "::error file=app/lib/main.dart::MaterialApp must set debugShowCheckedModeBanner: false."
            exit 1
          fi

      - name: Dependencies
        run: |
          set -euo pipefail
          flutter pub get
          cd app
          flutter gen-l10n

      # Without a writable /dev/kvm the x86_64 emulator falls back to software
      # emulation and times out.
      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Drive the tour on a Pixel 7 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: app
          # On Android takeScreenshot() needs convertFlutterSurfaceToImage(),
          # which the test calls; without a real GPU that only works with the
          # swiftshader renderer selected above.
          # reactivecircus runs every LINE of this script as its own `sh -c`, so
          # no bashisms and no backslash continuations: one command per line.
          script: |
            set -eu
            adb wait-for-device
            adb shell settings put global window_animation_scale 0
            adb uninstall com.crispstrobe.hectopolis || true
            SCREENSHOT_DEVICE=pixel_7_api34 flutter drive --driver=test_driver/integration_test.dart --target=integration_test/screenshots_test.dart -d emulator-5554

      - name: List the captured PNGs
        if: always()
        working-directory: app
        run: |
          set -euo pipefail
          if [ ! -d screenshots ]; then
            echo "::warning::no screenshots directory"
            exit 0
          fi
          find screenshots -name '*.png' | sort | while IFS= read -r png; do
            echo "$png $(wc -c < "$png") bytes"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-android
          path: app/screenshots
          if-no-files-found: error
          retention-days: 30
